services:
  # ---------------------------------------------
  # Backend Web Service
  # ---------------------------------------------
  - type: web
    name: nexus-server
    env: node
    region: oregon # Or your preferred region (e.g., frankfurt, singapore)
    plan: free # Change to 'starter' for a production environment without 15-minute sleep
    # Remove rootDir to ensure Render has access to the full pnpm workspace
    # Install pnpm, install all deps, then build just the server and its dependencies
    buildCommand: npm install -g pnpm && pnpm install && npx turbo run build --filter=server
    startCommand: cd apps/server && pnpm run start
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: DATABASE_URL
        sync: false # Do not sync this value to Render, you will enter it securely in the dashboard
      - key: JWT_SECRET
        generateValue: true # Render will automatically generate a secure 256-bit secret string for you
      - key: CLIENT_URL
        value: https://nexus-web.onrender.com # Will be overridden after frontend deploy if name differs
      - key: GEMINI_API_KEY
        sync: false # Enter this securely in the Render dashboard

  # ---------------------------------------------
  # Frontend Static Site
  # ---------------------------------------------
  - type: web
    name: nexus-web
    env: static
    # Remove rootDir to ensure Render has access to the full pnpm workspace
    # Install pnpm, install all deps, then build just the web frontend and its dependencies
    buildCommand: npm install -g pnpm && pnpm install && npx turbo run build --filter=web
    staticPublishPath: apps/web/dist
    envVars:
      - key: NODE_ENV
        value: production
      - key: VITE_API_URL
        fromService:
          type: web
          name: nexus-server
          property: host
